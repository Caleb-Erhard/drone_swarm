behaviors:
  DroneCoverage:
    trainer_type: ppo
    behavioral_cloning:
      demo_path: Assets/ML-Agents/Demonstrations/dronerecord.demo
      strength: 0.2
      steps: 500000
      samples_per_update: 512
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.98
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 3000000
    time_horizon: 256
    summary_freq: 10000
